# Builds the addon zip and publishes a GitHub release when a version tag (v*) is pushed.
# Forever Launcher's "Add from GitHub link" installs the latest release's zip,
# and picks assets whose name contains "forever".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        id: build
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # The addon folder is the top-level folder holding a .toc file named after itself.
          ADDON=""
          for d in */; do
            d="${d%/}"
            if [ -f "$d/$d.toc" ]; then ADDON="$d"; break; fi
          done
          if [ -z "$ADDON" ]; then echo "No addon folder found" >&2; exit 1; fi
          ZIP="${ADDON}-${TAG}-forever.zip"
          zip -r -q "$ZIP" "$ADDON" -x "*.DS_Store"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "addon=$ADDON" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.build.outputs.zip }}" --clobber
          else
            gh release create "$TAG" "${{ steps.build.outputs.zip }}" \
              --target "${{ github.sha }}" \
              --title "${{ steps.build.outputs.addon }} $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
